<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dylan Budner Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@200;300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #111110;
      --white: #f8f7f4;
      --muted-light: rgba(255,255,255,0.4);
      --muted-dark: #9a9a90;
      --rule-dark: #2e2e2c;
      --rule-light: #e0ded8;
    }

    html, body {
      height: 100%;
      background: var(--black);
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
    }

    /* ── LAYOUT ── */
    .page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: stretch;
    }

    /* ── LEFT: TITLE — black bg, white text ── */
    .title-block {
      background: var(--black);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0;
      padding: 0 8vw;
    }

    .title-line {
      display: flex;
      overflow: hidden;
    }

    .title-line span.word {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(52px, 8vw, 108px);
      line-height: 0.92;
      letter-spacing: -0.02em;
      display: inline-flex;
      color: var(--white);
    }

    /* Each letter animates individually */
    .letter {
      display: inline-block;
      transform: translateX(-120px);
      opacity: 0;
      animation: slideIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .label {
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted-light);
      margin-top: 28px;
      transform: translateX(-40px);
      opacity: 0;
      animation: slideIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* ── RIGHT: CONTENTS — white ribbon, black text ── */
    .contents-block {
      background: var(--white);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 8vw;
    }

    .contents-label {
      font-size: 9px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted-dark);
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeUp 0.6s forwards;
    }

    .project-list {
      list-style: none;
      border-top: 1px solid var(--rule-light);
    }

    .project-list li {
      border-bottom: 1px solid var(--rule-light);
      opacity: 0;
      animation: fadeUp 0.5s forwards;
    }

    .project-list li a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: var(--black);
      padding: 18px 0;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(20px, 2.5vw, 30px);
      letter-spacing: 0.01em;
      transform-origin: left center;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                  color 0.2s;
    }

    .project-list li a:hover {
      transform: scale(1.08);
      color: var(--black);
    }

    .project-list li a .num {
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--muted-dark);
      font-family: 'Montserrat', sans-serif;
      font-weight: 200;
      transition: color 0.2s;
    }

    .project-list li a:hover .num {
      color: var(--black);
    }

    /* Arrow that appears on hover */
    .project-list li a::after {
      content: '→';
      font-size: 18px;
      opacity: 0;
      transform: translateX(-10px);
      transition: opacity 0.25s, transform 0.25s;
      font-family: 'Cormorant Garamond', serif;
    }

    .project-list li a:hover::after {
      opacity: 1;
      transform: translateX(0);
    }

    /* ── FOOTER ── */
    footer {
      position: fixed;
      bottom: 28px;
      right: 40px;
      font-size: 9px;
      letter-spacing: 0.14em;
      color: var(--rule-dark);
      text-transform: uppercase;
    }

    /* ── ANIMATIONS ── */
    @keyframes slideIn {
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="page">

  <!-- LEFT: Animated title -->
  <div class="title-block">
    <div class="title-line" id="line-dylan"></div>
    <div class="title-line" id="line-budner"></div>
  </div>

  <!-- RIGHT: Project links -->
  <div class="contents-block">
    <p class="contents-label" style="animation-delay: 1.2s;">Contents</p>
    <ul class="project-list" id="project-list">
      <li style="animation-delay: 1.3s;"><a href="project-1.html"><span>Single Family Lake House</span><span class="num">01</span></a></li>
      <li style="animation-delay: 1.45s;"><a href="project-2.html"><span>Big Dumb Box</span><span class="num">02</span></a></li>
      <li style="animation-delay: 1.6s;"><a href="project-3.html"><span>Social Family Home</span><span class="num">03</span></a></li>
      <li style="animation-delay: 1.75s;"><a href="project-4.html"><span>Arizona Shade Structures</span><span class="num">04</span></a></li>
      <li style="animation-delay: 1.9s;"><a href="project-5.html"><span>From Words To Worlds</span><span class="num">05</span></a></li>
    </ul>
  </div>

</div>

<footer>© 2026 Dylan Budner</footer>

<script>
  // Animate each word letter by letter, sliding in from the left
  function animateWord(containerId, word, baseDelay, delayPerLetter) {
    const container = document.getElementById(containerId);
    const wordSpan = document.createElement('span');
    wordSpan.className = 'word';

    word.split('').forEach((char, i) => {
      const letter = document.createElement('span');
      letter.className = 'letter';
      letter.textContent = char === ' ' ? '\u00A0' : char;
      letter.style.animationDelay = (baseDelay + i * delayPerLetter) + 's';
      wordSpan.appendChild(letter);
    });

    container.appendChild(wordSpan);
  }

  animateWord('line-dylan',     'DYLAN',     0.1,  0.055);
  animateWord('line-budner',    'BUDNER',    0.45, 0.055);
</script>

</body>
</html>

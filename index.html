<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Dylan Budner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --ink: #111;
      --muted: #888;
      --sidebar: 220px;
      --hover-scale: 1.03;
      --fs: 15px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, sans-serif;
      font-size: var(--fs);
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    /* ── SIDEBAR ── */
    aside {
      width: var(--sidebar);
      flex-shrink: 0;
      position: fixed;
      top: 0; left: 0;
      height: 100vh;
      padding: 40px 28px;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      z-index: 10;
    }

    .site-name {
      font-family: Arial, sans-serif;
      font-size: var(--fs);
      font-weight: bold;
      color: var(--ink);
      text-decoration: none;
      cursor: pointer;
      margin-bottom: 20px;
      display: block;
      transition: opacity 0.2s;
    }
    .site-name:hover { opacity: 0.5; }

    nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    nav a {
      font-family: Arial, sans-serif;
      font-size: var(--fs);
      font-weight: normal;
      color: var(--ink);
      text-decoration: none;
      padding: 3px 0;
      display: flex;
      align-items: center;
      gap: 5px;
      position: relative;
      width: fit-content;
    }
    nav a::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 0;
      height: 1px;
      background: var(--ink);
      transition: width 0.25s ease;
    }
    nav a:hover::after { width: 100%; }

    .back-btn {
      display: none;
      font-family: Arial, sans-serif;
      font-size: var(--fs);
      color: var(--ink);
      background: none;
      border: none;
      cursor: pointer;
      padding: 3px 0;
      margin-bottom: 16px;
      text-align: left;
      align-items: center;
      gap: 5px;
    }
    .back-btn.visible { display: flex; }
    .back-btn:hover { opacity: 0.5; }

    .sidebar-footer {
      font-family: Arial, sans-serif;
      font-size: var(--fs);
      color: var(--muted);
    }

    /* ── MAIN ── */
    main {
      margin-left: var(--sidebar);
      flex: 1;
      padding: 40px 40px 80px;
      min-height: 100vh;
    }

    #home-view { display: block; }
    #project-view { display: none; }

    .grid-label {
      font-family: Arial, sans-serif;
      font-size: var(--fs);
      font-weight: bold;
      color: var(--ink);
      margin-bottom: 24px;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .grid-item {
      break-inside: avoid;
      margin-bottom: 16px;
      cursor: pointer;
      overflow: hidden;
      position: relative;
      isolation: isolate;
    }

    .grid-item img {
      width: 100%;
      display: block;
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      will-change: transform;
    }

    .grid-item:hover img {
      transform: translateZ(0) scale(var(--hover-scale));
    }

    .grid-item-label { display: none; }

    .grid-placeholder {
      width: 100%;
      background: #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #bbb;
      font-family: Arial, sans-serif;
      font-size: var(--fs);
    }

    /* ── PROJECT VIEW ── */
    #project-view { max-width: 860px; }

    .project-header { margin-bottom: 40px; }

    .project-title {
      font-family: Arial, sans-serif;
      font-size: var(--fs);
      font-weight: bold;
      margin-bottom: 6px;
    }

    .project-meta {
      font-family: Arial, sans-serif;
      font-size: var(--fs);
      color: var(--muted);
      display: flex;
      gap: 20px;
    }

    .project-description {
      font-family: Arial, sans-serif;
      font-size: var(--fs);
      line-height: 1.75;
      color: #444;
      max-width: 560px;
      margin-top: 16px;
    }

    .project-images {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 32px;
    }

    .project-images img { width: 100%; display: block; }

    .proj-img-placeholder {
      width: 100%;
      background: #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #bbb;
      font-family: Arial, sans-serif;
      font-size: var(--fs);
    }

    .fade-in { animation: fadeIn 0.4s ease forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .grid-item img { transition: none; }
      .fade-in { animation: none; }
    }
  </style>
</head>

<style>
  /* ── GALLERY ── */
  .gallery-wrap {
    position: relative;
    width: 100%;
    overflow: hidden;
    margin-bottom: 40px;
  }

  .gallery-track {
    display: flex;
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .gallery-track img {
    flex-shrink: 0;
    width: 100%;
    object-fit: contain;
    max-height: 520px;
    cursor: zoom-in;
    display: block;
    background: #f5f5f5;
  }

  .gallery-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    border: none;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    transition: background 0.2s;
    color: #111;
  }
  .gallery-btn:hover { background: rgba(255,255,255,0.6); }
  .gallery-btn.prev { left: 12px; }
  .gallery-btn.next { right: 12px; }

  .gallery-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 10px;
  }
  .gallery-dots span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #ccc;
    cursor: pointer;
    transition: background 0.2s;
  }
  .gallery-dots span.active { background: #111; }

  .gallery-section-title {
    font-family: Arial, sans-serif;
    font-size: 15px;
    font-weight: normal;
    color: #111;
    margin: 40px 0 16px;
  }

  /* ── LIGHTBOX ── */
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  #lightbox.open { display: flex; }

  #lightbox img {
    max-width: 90vw;
    max-height: 90vh;
    object-fit: contain;
    cursor: default;
  }

  #lightbox-close {
    position: fixed;
    top: 24px; right: 32px;
    color: #fff;
    font-size: 28px;
    cursor: pointer;
    background: none;
    border: none;
    line-height: 1;
    opacity: 0.8;
    transition: opacity 0.2s;
  }
  #lightbox-close:hover { opacity: 1; }

  #lightbox-prev, #lightbox-next {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    color: #fff;
    font-size: 28px;
    cursor: pointer;
    background: none;
    border: none;
    opacity: 0.7;
    transition: opacity 0.2s;
    padding: 16px;
  }
  #lightbox-prev:hover, #lightbox-next:hover { opacity: 1; }
  #lightbox-prev { left: 20px; }
  #lightbox-next { right: 20px; }
</style>

<!-- LIGHTBOX -->
<div id="lightbox">
  <button id="lightbox-close">✕</button>

  <img id="lightbox-img" src="" alt="">
  <button id="lightbox-next">&#8594;</button>
</div>

<script>
  // ── GALLERY BUILDER ──
  function buildGallery(id, images) {
    const wrap = document.getElementById(id);
    if (!wrap) return;

    const track = wrap.querySelector('.gallery-track');
    const dots = wrap.querySelector('.gallery-dots');
    let current = 0;

    images.forEach((src, i) => {
      const img = document.createElement('img');
      img.src = src;
      img.addEventListener('click', () => openLightbox(images, i));
      track.appendChild(img);

      const dot = document.createElement('span');
      if (i === 0) dot.classList.add('active');
      dot.addEventListener('click', () => goTo(i));
      dots.appendChild(dot);
    });

    function goTo(n) {
      current = (n + images.length) % images.length;
      track.style.transform = `translateX(-${current * 100}%)`;
      dots.querySelectorAll('span').forEach((d, i) => d.classList.toggle('active', i === current));
    }

    wrap.querySelector('.prev').addEventListener('click', () => goTo(current - 1));
    wrap.querySelector('.next').addEventListener('click', () => goTo(current + 1));
  }

  // ── LIGHTBOX ──
  let lbImages = [], lbIndex = 0;

  function openLightbox(images, index) {
    lbImages = images;
    lbIndex = index;
    document.getElementById('lightbox-img').src = lbImages[lbIndex];
    document.getElementById('lightbox').classList.add('open');
  }

  document.getElementById('lightbox-close').addEventListener('click', () => {
    document.getElementById('lightbox').classList.remove('open');
  });

  document.getElementById('lightbox-prev').addEventListener('click', () => {
    lbIndex = (lbIndex - 1 + lbImages.length) % lbImages.length;
    document.getElementById('lightbox-img').src = lbImages[lbIndex];
  });

  document.getElementById('lightbox-next').addEventListener('click', () => {
    lbIndex = (lbIndex + 1) % lbImages.length;
    document.getElementById('lightbox-img').src = lbImages[lbIndex];
  });

  document.getElementById('lightbox').addEventListener('click', (e) => {
    if (e.target === document.getElementById('lightbox')) {
      document.getElementById('lightbox').classList.remove('open');
    }

      `;

      document.getElementById('project-view').innerHTML = html;
      buildGallery('gallery-p4-photos', cp.photos);
      buildGallery('gallery-p4-drawings', cp.drawings);

    } else if (p.type === 'custom' && p.key === 'hardbox') {
      const cp = customProjects[p.key];
      html = `
        <div class="gallery-wrap" id="gallery-p5">
          <div class="gallery-track"></div>
          <button class="gallery-btn prev">&#8592;</button>
          <button class="gallery-btn next">&#8594;</button>
          <div class="gallery-dots"></div>
        </div>

        <p style="font-family:Arial,sans-serif; font-size:15px; color:#111; margin-top:32px; margin-bottom:60px; max-width:560px; line-height:1.8;"><strong>The Hardcore Inevitable Box</strong> reduces architecture to its most fundamental act: enclosure. The body occupies a simple opening that both protects and confines. Drawing from Robert Venturi's observation that architecture ultimately ends in the box, the coffin, the project reflects on the relationship between the human body and the spaces that contain it.</p>
      `;

      document.getElementById('project-view').innerHTML = html;
      buildGallery('gallery-p5', cp.photos);

    } else if (p.type === 'custom' && p.key === 'corewall') {
      const cp = customProjects[p.key];
      html = `
        <p style="font-family:Arial,sans-serif; font-size:15px; font-weight:bold; color:#111; margin-bottom:16px;">Core Versus Wall</p>

        <div style="display:flex; flex-direction:column; gap:16px; margin-bottom:60px;">
          ${cp.photos.map((src, i) => `<img src="${src}" alt="Core Versus Wall model photograph ${i + 1}" style="width:100%; display:block; cursor:zoom-in;" onclick='openLightbox(${JSON.stringify(cp.photos)}, ${i})'>`).join('')}
        </div>

        <p style="font-family:Arial,sans-serif; font-size:15px; font-weight:bold; color:#111; margin-bottom:16px;">Plans, Elevations, and Sections</p>
        <div class="gallery-wrap" id="gallery-p6-drawings">
          <div class="gallery-track"></div>
          <button class="gallery-btn prev">&#8592;</button>
          <button class="gallery-btn next">&#8594;</button>
          <div class="gallery-dots"></div>
        </div>
      `;

      document.getElementById('project-view').innerHTML = html;
      buildGallery('gallery-p6-drawings', cp.drawings);

    } else if (p.type === 'custom' && p.key === 'lakehouse') {
      const cp = customProjects[p.key];
      html = `
        <p style="font-family:Arial,sans-serif; font-size:15px; font-weight:bold; color:#111; margin-bottom:8px;">Single Family Lake House</p>
        <p style="font-family:Arial,sans-serif; font-size:15px; color:#555; margin-bottom:40px; max-width:560px; line-height:1.7;">Design for the complete renovation of a single-family lake house. This project is currently a work in progress.</p>

        <p style="font-family:Arial,sans-serif; font-size:15px; font-weight:bold; color:#111; margin-bottom:16px;">Working Design</p>
        <div class="gallery-wrap" id="gallery-p7-working">
          <div class="gallery-track"></div>
          <button class="gallery-btn prev">&#8592;</button>
          <button class="gallery-btn next">&#8594;</button>
          <div class="gallery-dots"></div>
        </div>

        <p style="font-family:Arial,sans-serif; font-size:15px; font-weight:bold; color:#111; margin-top:40px; margin-bottom:16px;">Previous House Layout</p>
        <div class="gallery-wrap" id="gallery-p7-previous">
          <div class="gallery-track"></div>
          <button class="gallery-btn prev">&#8592;</button>
          <button class="gallery-btn next">&#8594;</button>
          <div class="gallery-dots"></div>
        </div>

        <p style="font-family:Arial,sans-serif; font-size:15px; font-weight:bold; color:#111; margin-top:40px; margin-bottom:16px;">Measurement Report</p>
        <div class="gallery-wrap" id="gallery-p7-measurements">
          <div class="gallery-track"></div>
          <button class="gallery-btn prev">&#8592;</button>
          <button class="gallery-btn next">&#8594;</button>
          <div class="gallery-dots"></div>
        </div>
      `;

      document.getElementById('project-view').innerHTML = html;
      buildGallery('gallery-p7-working', cp.working);
      buildGallery('gallery-p7-previous', cp.previous);
      buildGallery('gallery-p7-measurements', cp.measurements);

    } else if (p.type === 'custom' && p.key === 'trees') {
      const cp = customProjects[p.key];
      html = `
        <div class="gallery-wrap" id="gallery-p8">
          <div class="gallery-track"></div>
          <button class="gallery-btn prev">&#8592;</button>
          <button class="gallery-btn next">&#8594;</button>
          <div class="gallery-dots"></div>
        </div>

        <p style="font-family:Arial,sans-serif; font-size:15px; font-weight:bold; color:#111; margin-top:40px;">Trees</p>
        <p style="font-family:Arial,sans-serif; font-size:15px; color:#555; margin-top:8px; margin-bottom:60px; max-width:560px; line-height:1.7;">Proposal to plant Norwegian spruce trees near the memorial steps.</p>
      `;

      document.getElementById('project-view').innerHTML = html;
      buildGallery('gallery-p8', cp.photos);

    } else if (p.type === 'custom' && p.key === 'bridge') {
      const cp = customProjects[p.key];
      html = `
        <div class="gallery-wrap" id="gallery-p9">
          <div class="gallery-track"></div>
          <button class="gallery-btn prev">&#8592;</button>
          <button class="gallery-btn next">&#8594;</button>
          <div class="gallery-dots"></div>
        </div>

        <p style="font-family:Arial,sans-serif; font-size:15px; font-weight:bold; color:#111; margin-top:40px; margin-bottom:24px;">Bridge Competition</p>

        <video controls playsinline preload="metadata" style="width:100%; display:block; background:#111; margin-bottom:60px;">
          <source src="${cp.video}" type="video/mp4">
          Your browser does not support embedded video.
        </video>
      `;

      document.getElementById('project-view').innerHTML = html;
      buildGallery('gallery-p9', cp.photos);

    } else {
      const metaParts = [p.location, p.year].filter(Boolean);
      const imagesHTML = p.images.map(img => {
        if (img.src) return `<img src="${img.src}" alt="">`;
        return `<div class="proj-img-placeholder" style="height:${img.h}px;">— image placeholder —</div>`;
      }).join('');

      html = `
        <div class="project-header">
          <h1 class="project-title">${p.title}</h1>
          <div class="project-meta">${metaParts.map(m => `<span>${m}</span>`).join('')}</div>
          ${p.description ? `<p class="project-description">${p.description}</p>` : ''}
        </div>
        <div class="project-images">${imagesHTML}</div>
      `;
      document.getElementById('project-view').innerHTML = html;
    }

    document.getElementById('home-view').style.display = 'none';
    document.getElementById('project-view').style.display = 'block';
    document.getElementById('project-view').classList.add('fade-in');
    document.getElementById('back-btn').classList.add('visible');
    window.scrollTo(0, 0);
  }
</script>

</body>
</html>

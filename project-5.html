<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>From Words To Worlds — Dylan Budner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #111110;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* ── BLACK BANNER ── */
    header {
      background: #111110;
      display: flex;
      align-items: center;
      padding: 0 32px;
      height: 56px;
      flex-shrink: 0;
    }

    .back-btn {
      text-decoration: none;
      color: #fff;
      font-size: 22px;
      line-height: 1;
      transition: opacity 0.2s, transform 0.2s;
    }

    .back-btn:hover {
      opacity: 0.6;
      transform: translateX(-4px);
    }

    /* ── PDF VIEWER ── */
    .pdf-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    embed {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <a class="back-btn" href="index.html">&#8592;</a>
  </header>

  <div class="pdf-wrap">
    <embed src="project-5.pdf" type="application/pdf" width="100%" height="100%" />
  </div>

</body>
</html>

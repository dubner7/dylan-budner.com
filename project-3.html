<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Social Family Home — Dylan Budner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@200;300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #111110;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #111110;
      display: flex;
      align-items: center;
      padding: 0 32px;
      height: 56px;
      flex-shrink: 0;
      gap: 24px;
    }

    .back-btn {
      text-decoration: none;
      color: #fff;
      font-size: 22px;
      line-height: 1;
      transition: opacity 0.2s, transform 0.2s;
      flex-shrink: 0;
    }

    .back-btn:hover {
      opacity: 0.6;
      transform: translateX(-4px);
    }

    .banner-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(12px, 1.4vw, 18px);
      color: #fff;
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pdf-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    embed {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <a class="back-btn" href="index.html">&#8592;</a>
    <span class="banner-title">Social Family Home, Killington, Vermont</span>
  </header>

  <div class="pdf-wrap">
    <embed src="project-3.pdf" type="application/pdf" width="100%" height="100%" />
  </div>

</body>
</html>

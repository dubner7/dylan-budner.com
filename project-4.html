<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Arizona Shade Structures — Dylan Budner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@200;300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #111110;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* ── BLACK BANNER ── */
    header {
      background: #111110;
      display: flex;
      align-items: center;
      padding: 0 32px;
      height: 56px;
      flex-shrink: 0;
      gap: 24px;
    }

    .back-btn {
      text-decoration: none;
      color: #fff;
      font-size: 22px;
      line-height: 1;
      transition: opacity 0.2s, transform 0.2s;
      flex-shrink: 0;
    }

    .back-btn:hover {
      opacity: 0.6;
      transform: translateX(-4px);
    }

    .banner-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(12px, 1.4vw, 18px);
      color: #fff;
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── PDF VIEWER ── */
    .pdf-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    embed {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
      border: none;
    }

    /* Placeholder shown until PDF is added */
    .pdf-placeholder {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #555;
      background: #1a1a18;
    }

    .pdf-placeholder svg { opacity: 0.3; }
    .pdf-placeholder p {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #555;
    }
  </style>
</head>
<body>

  <header>
    <a class="back-btn" href="index.html">&#8592;</a>
    <span class="banner-title">Shade Structures at James Henry Waddell Studio and Arcosanti, Arizona</span>
  </header>

  <div class="pdf-wrap">
    <!--
      Once you have the PDF ready, replace the placeholder div below with:
      <embed src="project-4.pdf" type="application/pdf" width="100%" height="100%" />
      Make sure Arizona_Shade_structures.pdf (or project-4.pdf) is in the same folder.
    -->
    <div class="pdf-placeholder">
      <svg width="48" height="60" viewBox="0 0 48 60" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="46" height="58" rx="2" stroke="#f8f7f4" stroke-width="1.5"/>
        <path d="M30 1V14H46" stroke="#f8f7f4" stroke-width="1.5"/>
        <line x1="10" y1="26" x2="38" y2="26" stroke="#f8f7f4" stroke-width="1.5"/>
        <line x1="10" y1="34" x2="38" y2="34" stroke="#f8f7f4" stroke-width="1.5"/>
        <line x1="10" y1="42" x2="26" y2="42" stroke="#f8f7f4" stroke-width="1.5"/>
      </svg>
      <p>Upload Arizona_Shade_structures.pdf and rename it project-4.pdf</p>
    </div>
  </div>

</body>
</html>
